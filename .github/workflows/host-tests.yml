name: Host Tests - Portable Core and Adapter Contract

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: ${{ matrix.compiler }} / C89
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build host tests
        run: |
          mkdir -p build
          ${{ matrix.compiler }} \
            -std=c89 \
            -Wall \
            -Wextra \
            -Werror \
            -pedantic \
            -Iinclude \
            src/core/ring_buffer.c \
            tests/test_ring_buffer.c \
            -o build/ring_buffer_tests
          ${{ matrix.compiler }} \
            -std=c89 \
            -Wall \
            -Wextra \
            -Werror \
            -pedantic \
            -Iinclude \
            -Iplatform/stc8 \
            src/core/ring_buffer.c \
            platform/stc8/stc8_uart.c \
            tests/test_stc8_uart_contract.c \
            -o build/stc8_uart_contract_tests

      - name: Run host tests
        run: |
          ./build/ring_buffer_tests
          ./build/stc8_uart_contract_tests
