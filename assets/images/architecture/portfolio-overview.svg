<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">STC8 peripheral driver progression</title><desc id="desc">Examples progress from register control through drivers and modules into event handling and multi-peripheral integration.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b949e"/></marker><style>.bg{fill:#0d1117}.grid{stroke:#30363d;opacity:.28}.box{stroke-width:2}.input{fill:#21262d;stroke:#8b949e}.core{fill:#0d419d;stroke:#58a6ff}.hardware{fill:#1f6f3d;stroke:#3fb950}.output{fill:#f0f6fc;stroke:#c9d1d9}.title{font:700 28px system-ui,sans-serif;fill:#f0f6fc}.sub{font:16px system-ui,sans-serif;fill:#8b949e}.label{font:700 17px system-ui,sans-serif;fill:#f0f6fc;text-anchor:middle}.detail{font:13px system-ui,sans-serif;fill:#c9d1d9;text-anchor:middle}.dark{fill:#0d1117}.arrow{fill:none;stroke:#8b949e;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1200" height="520" rx="22"/><path class="grid" d="M0 110H1200M0 410H1200M300 0V520M600 0V520M900 0V520"/>
  <text class="title" x="50" y="54">STC8 Peripheral Driver Progression</text><text class="sub" x="50" y="84">Register control grows into reusable modules, events, and integration paths</text>
  <rect class="box hardware" x="55" y="140" width="190" height="82" rx="14"/><text class="label" x="150" y="174">Register Control</text><text class="detail" x="150" y="201">GPIO · timer</text>
  <rect class="box core" x="275" y="200" width="190" height="82" rx="14"/><text class="label" x="370" y="234">Driver</text><text class="detail" x="370" y="261">UART · I²C · ADC</text>
  <rect class="box core" x="495" y="260" width="190" height="82" rx="14"/><text class="label" x="590" y="294">Module</text><text class="detail" x="590" y="321">RTC · OLED · key</text>
  <rect class="box input" x="715" y="320" width="190" height="82" rx="14"/><text class="label" x="810" y="354">Event</text><text class="detail" x="810" y="381">callback · buffer</text>
  <rect class="box output" x="935" y="380" width="210" height="82" rx="14"/><text class="label dark" x="1040" y="414">Integration</text><text class="detail dark" x="1040" y="441">multi-peripheral path</text>
  <path class="arrow" d="M245 190L275 215M465 255L495 275M685 325L715 340M905 385L935 400"/>
</svg>
